<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>促銷活動 ROI 分析工具</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0e0f11;
  --bg2: #161719;
  --bg3: #1e2023;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0ede8;
  --text2: #9a9791;
  --text3: #5c5a57;
  --accent: #d4f264;
  --accent2: #a8c94e;
  --blue: #5b9cf6;
  --orange: #f0854a;
  --red: #e05555;
  --green: #4caf82;
  --radius: 10px;
  --radius-sm: 6px;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans TC', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(14,15,17,0.92);
  backdrop-filter: blur(12px);
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mark {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-weight: 500;
  font-size: 13px;
  color: #0e0f11;
}
.logo-text { font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }
.header-badge {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
}

/* ── LAYOUT ── */
.main { max-width: 1100px; margin: 0 auto; padding: 40px 32px 80px; }

/* ── UPLOAD ZONE ── */
.upload-section {
  margin-bottom: 40px;
}
.upload-zone {
  border: 1.5px dashed var(--border2);
  border-radius: var(--radius);
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  background: var(--bg2);
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: rgba(212,242,100,0.04); }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.upload-icon {
  width: 48px; height: 48px;
  margin: 0 auto 16px;
  border-radius: 12px;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.upload-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
.upload-sub { font-size: 12px; color: var(--text2); }
.upload-hint { font-size: 11px; color: var(--text3); margin-top: 10px; font-family: var(--mono); }

.or-row {
  display: flex; align-items: center; gap: 16px;
  margin: 20px 0;
  color: var(--text3);
  font-size: 12px;
}
.or-row::before, .or-row::after { content:''; flex:1; height:1px; background:var(--border); }

.sample-btn {
  width: 100%;
  padding: 12px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text2);
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.sample-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }

/* ── METRICS ── */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 32px;
  animation: fadeUp 0.4s ease both;
}
.metric-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.metric-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.3s;
}
.metric-card:hover::before { opacity: 1; }
.metric-label { font-size: 11px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.metric-value { font-size: 24px; font-weight: 700; font-family: var(--mono); color: var(--text); }
.metric-value.green { color: var(--accent); }
.metric-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* ── TABS ── */
.tabs-row {
  display: flex; gap: 4px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 8px 16px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--text2);
  background: none;
  border: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

/* ── CHART ── */
.chart-wrap { position: relative; width: 100%; height: 300px; margin-bottom: 32px; }

/* ── TABLE ── */
.table-section { animation: fadeUp 0.5s ease 0.1s both; }
.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.section-title { font-size: 13px; font-weight: 500; color: var(--text2); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; }
.filter-row { display: flex; gap: 8px; align-items: center; }
.filter-row select {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--sans);
  font-size: 12px;
  padding: 5px 10px;
  cursor: pointer;
  outline: none;
}
.filter-row select:focus { border-color: var(--accent); }

.table-wrap {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; min-width: 680px; }
thead { background: var(--bg3); }
th {
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.1s; }
tbody tr:hover td { background: var(--bg3); }
.best-row td { background: rgba(212,242,100,0.04) !important; }

.rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  font-size: 11px;
  font-family: var(--mono);
  font-weight: 500;
}
.r1 { background: rgba(212,242,100,0.2); color: var(--accent); border: 1px solid rgba(212,242,100,0.3); }
.r2 { background: rgba(91,156,246,0.15); color: var(--blue); border: 1px solid rgba(91,156,246,0.25); }
.r3 { background: rgba(240,133,74,0.15); color: var(--orange); border: 1px solid rgba(240,133,74,0.25); }
.rn { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 500;
}
.tag-s { background: rgba(212,242,100,0.12); color: var(--accent); }
.tag-m { background: rgba(91,156,246,0.12); color: var(--blue); }
.tag-l { background: rgba(240,133,74,0.12); color: var(--orange); }

.roi-bar-outer { display: inline-block; width: 50px; height: 4px; background: var(--bg3); border-radius: 2px; vertical-align: middle; margin-left: 6px; }
.roi-bar-inner { height: 100%; border-radius: 2px; }
.mono { font-family: var(--mono); }
.positive { color: var(--accent); }
.neutral { color: var(--text2); }

/* ── EMPTY / LOADING ── */
.empty-state {
  text-align: center;
  padding: 80px 40px;
  color: var(--text3);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-title { font-size: 15px; font-weight: 500; color: var(--text2); margin-bottom: 8px; }
.empty-sub { font-size: 13px; }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.results { animation: fadeUp 0.4s ease both; }

/* ── BEST CALLOUT ── */
.best-callout {
  background: linear-gradient(135deg, rgba(212,242,100,0.08), rgba(212,242,100,0.03));
  border: 1px solid rgba(212,242,100,0.2);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.best-badge {
  background: var(--accent);
  color: #0e0f11;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 4px;
  white-space: nowrap;
}
.best-text { font-size: 13px; color: var(--text2); }
.best-text strong { color: var(--text); }

/* ── FOOTER ── */
.footer {
  margin-top: 60px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--text3);
  font-size: 11px;
  font-family: var(--mono);
}

@media (max-width: 640px) {
  .main { padding: 24px 16px 60px; }
  .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  .header { padding: 16px 20px; }
  .table-header { flex-direction: column; align-items: flex-start; gap: 10px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-mark">ROI</div>
    <span class="logo-text">促銷活動分析</span>
  </div>
  <div class="header-badge">POC v1.0</div>
</header>

<main class="main">

  <!-- Upload -->
  <div class="upload-section">
    <div class="upload-zone" id="dropzone">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleFile(this.files[0])">
      <div class="upload-icon">📂</div>
      <div class="upload-title">拖曳或點擊上傳 Excel / CSV</div>
      <div class="upload-sub">支援 .xlsx · .xls · .csv 格式</div>
      <div class="upload-hint">欄位需包含：活動名稱（或活動）、成本、營收（或收益）</div>
    </div>
    <div class="or-row">或</div>
    <button class="sample-btn" onclick="loadSample()">
      <span>📊</span> 載入內建範例資料（89 筆 MKT-004）
    </button>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">📈</div>
    <div class="empty-title">尚無資料</div>
    <div class="empty-sub">上傳 Excel 或載入範例資料開始分析</div>
  </div>

  <!-- Results -->
  <div class="results" id="results" style="display:none">

    <!-- Metrics -->
    <div class="metrics-grid" id="metricsGrid"></div>

    <!-- Best callout -->
    <div class="best-callout" id="bestCallout"></div>

    <!-- Chart -->
    <div class="tabs-row">
      <button class="tab-btn active" onclick="switchTab('roi',this)">ROI 排行</button>
      <button class="tab-btn" onclick="switchTab('profit',this)">淨利潤</button>
      <button class="tab-btn" onclick="switchTab('type',this)">類型平均</button>
      <button class="tab-btn" onclick="switchTab('scatter',this)">成本 vs 收益</button>
    </div>
    <div class="chart-wrap"><canvas id="mainChart" role="img" aria-label="促銷ROI分析圖表"></canvas></div>

    <!-- Table -->
    <div class="table-section">
      <div class="table-header">
        <span class="section-title" id="tableTitle">排行榜</span>
        <div class="filter-row">
          <select id="filterType" onchange="applyFilters()">
            <option value="">全部類型</option>
          </select>
          <select id="filterPeriod" onchange="applyFilters()">
            <option value="">全部期間</option>
          </select>
          <select id="filterTop" onchange="applyFilters()">
            <option value="10">前 10 名</option>
            <option value="20">前 20 名</option>
            <option value="50">前 50 名</option>
            <option value="999">全部</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

</main>

<footer class="main footer">
  <span>促銷 ROI 分析工具 · POC v1.0</span>
  <span id="dataInfo">—</span>
</footer>

      processRows(rows, file.name);
    } catch(err) { alert('讀取失敗：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function processRows(rows, filename) {
  const colMap = {
    name:    ['活動名稱','活動','name','campaign'],
    cost:    ['成本','cost','費用','投入'],
    revenue: ['營收','收益','revenue','sales','業績'],
    type:    ['類型','type','活動類型','category'],
    period:  ['期間','period','週期'],
    orders:  ['訂單數','訂單','orders','order']
  };
  function findCol(row, keys) {
    const rkeys = Object.keys(row).map(k => k.trim().toLowerCase());
    for (const k of keys) {
      const match = Object.keys(row).find(rk => rk.trim().toLowerCase().includes(k.toLowerCase()));
      if (match) return match;
    }
    return null;
  }
  if (rows.length === 0) { alert('找不到資料列'); return; }
  const sample = rows[0];
  const costCol    = findCol(sample, colMap.cost);
  const revCol     = findCol(sample, colMap.revenue);
  const typeCol    = findCol(sample, colMap.type) || findCol(sample, colMap.name);
  const periodCol  = findCol(sample, colMap.period);
  const ordersCol  = findCol(sample, colMap.orders);

  if (!costCol || !revCol) { alert('找不到成本或營收欄位，請確認欄位名稱包含「成本」「營收」'); return; }

  data = rows.map(r => {
    const cost    = parseFloat(String(r[costCol] || '').replace(/[元,\s]/g, '')) || 0;
    const revenue = parseFloat(String(r[revCol]  || '').replace(/[元,\s]/g, '')) || 0;
    const type    = typeCol   ? String(r[typeCol]   || '').trim() || '未知' : '未知';
    const period  = periodCol ? String(r[periodCol] || '').trim() || '—'   : '—';
    const orders  = ordersCol ? parseInt(r[ordersCol]) || 0 : 0;
    return { type, period, cost, revenue, orders };
  }).filter(r => r.cost > 0 && r.revenue > 0);

  data = data.map(r => ({ ...r, roi: calcROI(r.cost, r.revenue), profit: r.revenue - r.cost }))
             .sort((a, b) => b.roi - a.roi);

  document.getElementById('dataInfo').textContent = `${filename} · ${data.length} 筆`;
  buildFilters();
  render();
}

function loadSample() {
  data = SAMPLE.map(r => ({ ...r, roi: calcROI(r.cost, r.revenue), profit: r.revenue - r.cost }))
               .sort((a, b) => b.roi - a.roi);
  document.getElementById('dataInfo').textContent = `MKT-004 內建資料 · ${data.length} 筆`;
  buildFilters();
  render();
}

// ── FILTERS ──
function buildFilters() {
  const types   = [...new Set(data.map(r => r.type))].sort();
  const periods = [...new Set(data.map(r => r.period))].sort();
  const ts = document.getElementById('filterType');
  const ps = document.getElementById('filterPeriod');
  ts.innerHTML = '<option value="">全部類型</option>' + types.map(t => `<option>${t}</option>`).join('');
  ps.innerHTML = '<option value="">全部期間</option>' + periods.map(p => `<option>${p}</option>`).join('');
}

function getFiltered() {
  const t = document.getElementById('filterType').value;
  const p = document.getElementById('filterPeriod').value;
  const top = parseInt(document.getElementById('filterTop').value);
  return data.filter(r => (!t || r.type === t) && (!p || r.period === p)).slice(0, top);
}

function applyFilters() { render(); }

// ── RENDER ──
function render() {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('results').style.display = '';
  renderMetrics();
  renderBest();
  renderTable();
  renderChart(getFiltered());
}

function renderMetrics() {
  const tot = data.length;
  const totalCost = data.reduce((s, r) => s + r.cost, 0);
  const totalRev  = data.reduce((s, r) => s + r.revenue, 0);
  const avgROI    = data.reduce((s, r) => s + r.roi, 0) / data.length;
  document.getElementById('metricsGrid').innerHTML = `
    <div class="metric-card"><div class="metric-label">活動總數</div><div class="metric-value">${tot}</div></div>
    <div class="metric-card"><div class="metric-label">總投入成本</div><div class="metric-value" style="font-size:18px">${fmt(totalCost)}</div></div>
    <div class="metric-card"><div class="metric-label">總活動營收</div><div class="metric-value" style="font-size:18px">${fmt(totalRev)}</div></div>
    <div class="metric-card"><div class="metric-label">平均 ROI</div><div class="metric-value green">${fmtROI(avgROI)}</div></div>
  `;
}

function renderBest() {
  const best = data[0];
  if (!best) return;
  document.getElementById('bestCallout').innerHTML = `
    <div class="best-badge">★ 最划算</div>
    <div class="best-text">
      <strong>${best.type} × ${best.period}</strong> — 成本 ${fmt(best.cost)}，營收 ${fmt(best.revenue)}，
      ROI <strong style="color:var(--accent)">${fmtROI(best.roi)}</strong>，淨利潤 <strong>+${fmt(best.profit)}</strong>
    </div>
  `;
}

function renderTable() {
  const rows = getFiltered();
  const maxROI = Math.max(...rows.map(r => r.roi));
  document.getElementById('tableTitle').textContent = `排行榜 · ${rows.length} 筆`;
  document.getElementById('tableHead').innerHTML = `<tr>
    <th>排名</th><th>活動類型</th><th>期間</th><th>成本</th><th>營收</th><th>淨利潤</th>
    <th>訂單數</th><th>ROI</th><th>評級</th>
  </tr>`;
  document.getElementById('tableBody').innerHTML = rows.map((r, i) => {
    const rc  = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : 'rn';
    const rt  = getRating(r.roi);
    const pct = Math.min(100, (r.roi / maxROI) * 100).toFixed(0);
    const bc  = r.roi >= 10000 ? '#d4f264' : r.roi >= 3000 ? '#5b9cf6' : '#f0854a';
    const rw  = i === 0 ? 'best-row' : '';
    return `<tr class="${rw}">
      <td><span class="rank-badge ${rc}">${i+1}</span></td>
      <td class="mono" style="font-weight:500">${r.type}</td>
      <td style="color:var(--text2)">${r.period}</td>
      <td class="mono">${fmt(r.cost)}</td>
      <td class="mono">${fmt(r.revenue)}</td>
      <td class="mono positive">+${fmt(r.profit)}</td>
      <td class="mono neutral">${r.orders || '—'}</td>
      <td>
        <span class="mono" style="font-weight:500">${fmtROI(r.roi)}</span>
        <span class="roi-bar-outer"><span class="roi-bar-inner" style="width:${pct}%;background:${bc}"></span></span>
      </td>
      <td><span class="tag ${rt.cls}">${rt.label}</span></td>
    </tr>`;
  }).join('');
}

// ── CHART ──
function switchTab(tab, el) {
  curTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderChart(getFiltered());
}

function renderChart(rows) {
  if (chartInst) { chartInst.destroy(); chartInst = null; }
  const ctx = document.getElementById('mainChart').getContext('2d');
  const tc = '#5c5a57';
  const gc = 'rgba(255,255,255,0.05)';

  if (curTab === 'roi') {
    const top = rows.slice(0, 15);
    const labels = top.map(r => `${r.type}/${r.period}`);
    const vals = top.map(r => parseFloat((r.roi / 1000).toFixed(2)));
    const colors = vals.map(v => v >= 10 ? '#d4f264' : v >= 3 ? '#5b9cf6' : '#f0854a');
    chartInst = new Chart(ctx, { type: 'bar',
      data: { labels, datasets: [{ data: vals, backgroundColor: colors, borderRadius: 4, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ROI: ${(c.parsed.y * 1000).toLocaleString()}%` } } },
        scales: { y: { ticks: { color: tc, callback: v => v + 'K%' }, grid: { color: gc } }, x: { ticks: { color: tc, font: { size: 10 }, maxRotation: 40, autoSkip: false }, grid: { display: false } } } }
    });
  } else if (curTab === 'profit') {
    const top = rows.slice(0, 15);
    chartInst = new Chart(ctx, { type: 'bar',
      data: { labels: top.map(r => `${r.type}/${r.period}`), datasets: [{ data: top.map(r => r.profit), backgroundColor: '#4caf82', borderRadius: 4, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` 淨利潤: ${c.parsed.y.toLocaleString()}` } } },
        scales: { y: { ticks: { color: tc, callback: v => v >= 1000 ? Math.round(v/1000)+'K' : v }, grid: { color: gc } }, x: { ticks: { color: tc, font: { size: 10 }, maxRotation: 40, autoSkip: false }, grid: { display: false } } } }
    });
  } else if (curTab === 'type') {
    const types = [...new Set(data.map(r => r.type))];
    const avgs = types.map(t => { const g = data.filter(r => r.type === t); return parseFloat((g.reduce((s, r) => s + r.roi, 0) / g.length / 1000).toFixed(2)); });
    const palette = ['#d4f264','#5b9cf6','#4caf82','#f0854a','#e05555','#c084fc','#fb923c','#34d399'];
    chartInst = new Chart(ctx, { type: 'bar',
      data: { labels: types, datasets: [{ data: avgs, backgroundColor: types.map((_,i) => palette[i % palette.length]), borderRadius: 4, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` 平均ROI: ${(c.parsed.y * 1000).toLocaleString()}%` } } },
        scales: { y: { ticks: { color: tc, callback: v => v + 'K%' }, grid: { color: gc } }, x: { ticks: { color: tc }, grid: { display: false } } } }
    });
  } else {
    const pts = rows.map(r => ({ x: r.cost, y: r.revenue, label: `${r.type}/${r.period}` }));
    const mx = Math.max(...rows.map(r => Math.max(r.cost, r.revenue)));
    chartInst = new Chart(ctx, { type: 'scatter',
      data: { datasets: [{ data: pts, backgroundColor: rows.map(r => r.roi >= 10000 ? '#d4f264' : r.roi >= 3000 ? '#5b9cf6' : '#f0854a'), pointRadius: 5, pointHoverRadius: 7 }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.raw.label}  成本:${c.raw.x}  營收:${c.raw.y.toLocaleString()}` } } },
        scales: { x: { title: { display: true, text: '成本', color: tc }, ticks: { color: tc }, grid: { color: gc }, min: 0, max: mx * 1.1 }, y: { title: { display: true, text: '營收', color: tc }, ticks: { color: tc, callback: v => v >= 1000 ? Math.round(v/1000)+'K' : v }, grid: { color: gc }, min: 0, max: mx * 1.1 } } }
    });
  }
}

// ── DRAG & DROP ──
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
</script>
